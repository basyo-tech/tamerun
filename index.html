<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="たまるん">
<title>たまるん</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f2f4f7;color:#222;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{background:#34a98f;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:20px;font-weight:700}
.page{display:none;padding:14px}.page.active{display:block}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.total{display:flex;gap:10px}.total div{flex:1;text-align:center}
.total b{display:block;font-size:24px;color:#34a98f;margin-top:4px}
label{font-size:13px;color:#666;display:block;margin:10px 0 4px}
input,select{display:block;width:100%;min-width:0;height:46px;margin:0;font-size:17px;line-height:1.2;padding:0 10px;border:1px solid #ccd;border-radius:10px;background:#fff;color:#222;-webkit-appearance:none;appearance:none}
input[type=date]{text-align:left;-webkit-min-logical-width:0}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
textarea{display:block;width:100%;height:110px;font-size:13px;padding:8px;border:1px solid #ccd;border-radius:10px;margin-top:10px}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.labelrow{display:flex;gap:8px;align-items:center}
.labelrow select{flex:1}
.addlabel{height:46px;padding:0 12px;border:1px solid #34a98f;background:#fff;color:#34a98f;font-size:14px;font-weight:700;border-radius:10px;white-space:nowrap}
button.main{width:100%;margin-top:14px;padding:13px;font-size:17px;font-weight:700;color:#fff;background:#34a98f;border:0;border-radius:12px}
button.sub{width:100%;margin-top:10px;padding:12px;font-size:16px;font-weight:700;color:#34a98f;background:#fff;border:2px solid #34a98f;border-radius:12px}
.note{font-size:12px;color:#888;margin-top:8px;line-height:1.5}
.item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item:last-child{border:0}
.item .name{flex:1}.item small{color:#888;display:block}
.tag{display:inline-block;background:#dff3ee;color:#1f7a67;border-radius:8px;padding:1px 8px;font-size:12px;margin-right:6px}
.del{border:0;background:none;color:#c44;font-size:20px;padding:4px 8px}
.buy{border:0;background:#34a98f;color:#fff;font-size:14px;font-weight:700;border-radius:10px;padding:8px 10px;margin-left:6px;white-space:nowrap}
.undo{border:1px solid #bbb;background:#fff;color:#666;font-size:13px;border-radius:10px;padding:6px 8px;margin-left:6px;white-space:nowrap}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #ddd;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px 0;border:0;background:none;font-size:12px;color:#888}
nav button.active{color:#34a98f;font-weight:700}
.empty{color:#999;text-align:center;padding:12px}
.bar{height:10px;background:#e6ebef;border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:#34a98f}
.ok{color:#1f7a67;font-weight:700}
.chartwrap{width:100%;height:220px}
canvas{width:100%;height:100%;display:block}
</style>
</head>
<body>
<header>たまるん</header>

<section id="tab-food" class="page active">
  <div class="card total">
    <div>浮いたお金<b id="sumYen">0円</b></div>
    <div>減らしたカロリー<b id="sumKcal">0kcal</b></div>
  </div>
  <div class="card">
    <strong>買わなかったものを記録</strong>
    <label>品名</label><input id="fName" placeholder="例：ポテトチップス">
    <label>ラベル</label>
    <div class="labelrow">
      <select id="fLabel"></select>
      <button class="addlabel" id="fAddLabel">＋追加</button>
    </div>
    <div class="row">
      <div><label>カロリー(kcal)</label><input id="fKcal" type="number" inputmode="numeric" placeholder="350"></div>
      <div><label>金額(円)</label><input id="fYen" type="number" inputmode="numeric" placeholder="200"></div>
    </div>
    <button class="main" id="fAdd">記録する</button>
  </div>
  <div class="card"><strong>記録一覧</strong><div id="fList"></div></div>
</section>

<section id="tab-weight" class="page">
  <div class="card">
    <strong>体重を記録</strong>
    <div class="row">
      <div><label>日付</label><input id="wDate" type="date"></div>
      <div><label>体重(kg)</label><input id="wVal" type="number" step="0.1" inputmode="decimal" placeholder="60.5"></div>
    </div>
    <button class="main" id="wAdd">記録する</button>
  </div>
  <div class="card"><strong>体重の推移</strong><div class="chartwrap"><canvas id="wChart"></canvas></div></div>
  <div class="card"><strong>記録一覧</strong><div id="wList"></div></div>
</section>

<section id="tab-wish" class="page">
  <div class="card total">
    <div>使えるお金<b id="wSaved">0円</b></div>
    <div>購入済み合計<b id="wSpent">0円</b></div>
  </div>
  <div class="card">
    <strong>欲しいものを登録</strong>
    <label>名前</label><input id="gName" placeholder="例：ワイヤレスイヤホン">
    <label>金額(円)</label><input id="gYen" type="number" inputmode="numeric" placeholder="12000">
    <button class="main" id="gAdd">登録する</button>
  </div>
  <div class="card"><strong>欲しいもの一覧</strong><div id="gList"></div></div>
  <div class="card"><strong>購入済み</strong><div id="bList"></div></div>
</section>

<section id="tab-set" class="page">
  <div class="card">
    <strong>バックアップ</strong>
    <div class="note" id="lastBackup">まだバックアップしていません</div>
    <button class="main" id="bExport">ファイルに書き出す</button>
    <button class="sub" id="bImportBtn">ファイルから復元する</button>
    <input id="bFile" type="file" accept=".json,application/json" style="display:none">
    <div class="note">書き出したファイルは「ファイル」アプリやiCloud Driveなどに保存しておくと安心です。復元すると、今のデータは上書きされます。</div>
  </div>
  <div class="card">
    <strong>テキストでバックアップ</strong>
    <div class="note">ファイルがうまく扱えないときは、こちらを使います。</div>
    <button class="sub" id="tShow">データをテキストで表示</button>
    <button class="sub" id="tCopy">コピーする</button>
    <textarea id="tArea" placeholder="ここに表示・貼り付け"></textarea>
    <button class="sub" id="tRestore">貼り付けた内容で復元する</button>
  </div>
  <div class="card">
    <strong>ラベルの管理</strong>
    <div class="note">「やめた」タブの「＋追加」からも追加できます。削除しても、過去の記録のラベルは残ります。</div>
    <div id="labelList"></div>
  </div>
</section>

<nav>
  <button data-tab="food" class="active">🍞 やめた</button>
  <button data-tab="weight">⚖️ 体重</button>
  <button data-tab="wish">🎁 欲しい</button>
  <button data-tab="set">⚙️ 設定</button>
</nav>

<script>
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_LABELS=['パン','スナック','お菓子','飲み物','外食','その他'];
let foods=load('tamarun_foods',[]);
let weights=load('tamarun_weights',[]);
let wishes=load('tamarun_wishes',[]);
let labels=load('tamarun_labels',DEFAULT_LABELS.slice());

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id==='tab-'+b.dataset.tab));
  if(b.dataset.tab==='weight')renderWeights();
  if(b.dataset.tab==='wish')renderWishes();
  if(b.dataset.tab==='set')renderSettings();
});

function renderLabels(){
  const sel=document.getElementById('fLabel');
  const cur=sel.value;
  sel.innerHTML=labels.map(l=>`<option>${esc(l)}</option>`).join('');
  if(labels.includes(cur))sel.value=cur;
  document.getElementById('labelList').innerHTML=labels.map((l,i)=>`<div class="item"><div class="name"><span class="tag">${esc(l)}</span></div><button class="del" onclick="delLabel(${i})">✕</button></div>`).join('');
}
function addLabel(){
  const v=prompt('新しいラベル名を入力してください');
  if(v===null)return;
  const name=v.trim();
  if(!name)return;
  if(labels.includes(name)){alert('そのラベルはすでにあります');document.getElementById('fLabel').value=name;return}
  labels.push(name);save('tamarun_labels',labels);renderLabels();
  document.getElementById('fLabel').value=name;
}
function delLabel(i){
  if(labels.length<=1){alert('ラベルは1つ以上必要です');return}
  if(!confirm('「'+labels[i]+'」を選択肢から削除しますか？（過去の記録は変わりません）'))return;
  labels.splice(i,1);save('tamarun_labels',labels);renderLabels();
}
document.getElementById('fAddLabel').onclick=addLabel;

function renderFoods(){
  const yen=foods.reduce((s,f)=>s+f.yen,0), kcal=foods.reduce((s,f)=>s+f.kcal,0);
  document.getElementById('sumYen').textContent=yen.toLocaleString()+'円';
  document.getElementById('sumKcal').textContent=kcal.toLocaleString()+'kcal';
  const list=document.getElementById('fList');
  if(!foods.length){list.innerHTML='<div class="empty">まだ記録がありません</div>';return}
  list.innerHTML=foods.slice().reverse().map(f=>`<div class="item">
    <div class="name">${esc(f.name)}<small><span class="tag">${esc(f.label)}</span>${f.kcal}kcal ・ ${f.yen}円 ・ ${f.date}</small></div>
    <button class="del" onclick="delFood(${f.id})">✕</button></div>`).join('');
}
function delFood(id){foods=foods.filter(f=>f.id!==id);save('tamarun_foods',foods);renderFoods()}
document.getElementById('fAdd').onclick=()=>{
  const name=document.getElementById('fName').value.trim();
  if(!name){alert('品名を入れてください');return}
  const d=new Date();
  foods.push({id:Date.now(),name,label:document.getElementById('fLabel').value,
    kcal:Number(document.getElementById('fKcal').value)||0,
    yen:Number(document.getElementById('fYen').value)||0,
    date:`${d.getMonth()+1}/${d.getDate()}`});
  save('tamarun_foods',foods);
  ['fName','fKcal','fYen'].forEach(i=>document.getElementById(i).value='');
  renderFoods();
};

const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
document.getElementById('wDate').value=todayStr();
const shortDate=s=>Number(s.slice(5,7))+'/'+Number(s.slice(8,10));

function renderWeights(){
  weights.sort((a,b)=>a.date.localeCompare(b.date));
  const list=document.getElementById('wList');
  list.innerHTML=weights.length?weights.slice().reverse().map(w=>`<div class="item">
    <div class="name">${w.kg}kg<small>${w.date}</small></div>
    <button class="del" onclick="delWeight('${w.date}')">✕</button></div>`).join(''):'<div class="empty">まだ記録がありません</div>';
  drawChart();
}
function delWeight(date){weights=weights.filter(w=>w.date!==date);save('tamarun_weights',weights);renderWeights()}
document.getElementById('wAdd').onclick=()=>{
  const date=document.getElementById('wDate').value;
  const kg=Number(document.getElementById('wVal').value);
  if(!date||!kg||kg<=0){alert('日付と体重を入れてください');return}
  weights=weights.filter(w=>w.date!==date);
  weights.push({date,kg});
  save('tamarun_weights',weights);
  document.getElementById('wVal').value='';
  renderWeights();
};
function drawChart(){
  const cv=document.getElementById('wChart');
  const r=cv.getBoundingClientRect();
  if(!r.width)return;
  const dpr=window.devicePixelRatio||1;
  cv.width=r.width*dpr;cv.height=r.height*dpr;
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  const W=r.width,H=r.height;c.clearRect(0,0,W,H);
  c.font='11px sans-serif';c.textBaseline='middle';
  if(weights.length<1){c.fillStyle='#999';c.textAlign='center';c.fillText('記録するとグラフが表示されます',W/2,H/2);return}
  const L=38,R=14,T=14,B=26;
  const vals=weights.map(w=>w.kg);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(max-min<1){min-=0.5;max+=0.5}
  const pad=(max-min)*0.15;min-=pad;max+=pad;
  const x=i=>weights.length===1?(L+(W-L-R)/2):L+(W-L-R)*i/(weights.length-1);
  const y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  c.strokeStyle='#eee';c.fillStyle='#888';c.textAlign='right';c.lineWidth=1;
  for(let k=0;k<=4;k++){
    const v=min+(max-min)*k/4,yy=y(v);
    c.beginPath();c.moveTo(L,yy);c.lineTo(W-R,yy);c.stroke();
    c.fillText(v.toFixed(1),L-4,yy);
  }
  c.textAlign='center';
  const step=Math.max(1,Math.ceil(weights.length/5));
  weights.forEach((w,i)=>{if(i%step===0||i===weights.length-1)c.fillText(shortDate(w.date),x(i),H-B+14)});
  c.strokeStyle='#34a98f';c.lineWidth=2.5;c.lineJoin='round';c.beginPath();
  weights.forEach((w,i)=>i?c.lineTo(x(i),y(w.kg)):c.moveTo(x(i),y(w.kg)));c.stroke();
  c.fillStyle='#34a98f';
  weights.forEach((w,i)=>{c.beginPath();c.arc(x(i),y(w.kg),4,0,Math.PI*2);c.fill()});
}
window.addEventListener('resize',drawChart);

function renderWishes(){
  const saved=foods.reduce((s,f)=>s+f.yen,0);
  const spent=wishes.filter(g=>g.bought).reduce((s,g)=>s+g.yen,0);
  const avail=saved-spent;
  document.getElementById('wSaved').textContent=avail.toLocaleString()+'円';
  document.getElementById('wSpent').textContent=spent.toLocaleString()+'円';
  const todo=wishes.filter(g=>!g.bought), done=wishes.filter(g=>g.bought);
  const list=document.getElementById('gList');
  list.innerHTML=todo.length?todo.map(g=>{
    const pct=g.yen>0?Math.max(0,Math.min(100,Math.floor(avail/g.yen*100))):100;
    const rest=Math.max(0,g.yen-avail);
    const can=rest===0;
    const msg=can?'<span class="ok">買えます！🎉</span>':'あと'+rest.toLocaleString()+'円';
    return `<div class="item"><div class="name">${esc(g.name)}<small>${g.yen.toLocaleString()}円 ・ ${msg}（${pct}%）</small><div class="bar"><i style="width:${pct}%"></i></div></div>
    ${can?`<button class="buy" onclick="buyWish(${g.id})">購入した</button>`:''}
    <button class="del" onclick="delWish(${g.id})">✕</button></div>`}).join(''):'<div class="empty">まだ登録がありません</div>';
  const bl=document.getElementById('bList');
  bl.innerHTML=done.length?done.slice().reverse().map(g=>`<div class="item"><div class="name">${esc(g.name)}<small>${g.yen.toLocaleString()}円 ・ ${g.boughtDate||''}</small></div>
    <button class="undo" onclick="undoWish(${g.id})">戻す</button>
    <button class="del" onclick="delWish(${g.id})">✕</button></div>`).join(''):'<div class="empty">購入したものはまだありません</div>';
}
function buyWish(id){
  const g=wishes.find(x=>x.id===id);if(!g)return;
  if(!confirm(g.name+'を購入済みにして、'+g.yen.toLocaleString()+'円を使えるお金から引きますか？'))return;
  const d=new Date();
  g.bought=true;g.boughtDate=`${d.getMonth()+1}/${d.getDate()}`;
  save('tamarun_wishes',wishes);renderWishes();
}
function undoWish(id){
  const g=wishes.find(x=>x.id===id);if(!g)return;
  g.bought=false;delete g.boughtDate;
  save('tamarun_wishes',wishes);renderWishes();
}
function delWish(id){wishes=wishes.filter(g=>g.id!==id);save('tamarun_wishes',wishes);renderWishes()}
document.getElementById('gAdd').onclick=()=>{
  const name=document.getElementById('gName').value.trim();
  const yen=Number(document.getElementById('gYen').value);
  if(!name||!yen||yen<=0){alert('名前と金額を入れてください');return}
  wishes.push({id:Date.now(),name,yen,bought:false});
  save('tamarun_wishes',wishes);
  document.getElementById('gName').value='';document.getElementById('gYen').value='';
  renderWishes();
};

function buildBackup(){
  return JSON.stringify({app:'tamarun',version:1,exportedAt:new Date().toISOString(),foods,weights,wishes,labels},null,1);
}
function markBackup(){
  localStorage.setItem('tamarun_lastbackup',new Date().toLocaleString('ja-JP'));
  renderSettings();
}
function renderSettings(){
  const t=localStorage.getItem('tamarun_lastbackup');
  document.getElementById('lastBackup').textContent=t?('前回のバックアップ：'+t):'まだバックアップしていません';
  renderLabels();
}
async function exportFile(){
  const json=buildBackup();
  const name='tamarun-backup-'+todayStr()+'.json';
  const file=new File([json],name,{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:'たまるんのバックアップ'});markBackup();return}
    catch(e){if(e&&e.name==='AbortError')return}
  }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  markBackup();
}
function applyBackup(text){
  let d;
  try{d=JSON.parse(text)}catch(e){alert('データを読み取れませんでした。内容を確認してください');return false}
  if(!d||d.app!=='tamarun'||!Array.isArray(d.foods)||!Array.isArray(d.weights)||!Array.isArray(d.wishes)){alert('たまるんのバックアップではないようです');return false}
  const info='やめた '+d.foods.length+'件 / 体重 '+d.weights.length+'件 / 欲しいもの '+d.wishes.length+'件';
  if(!confirm('今のデータを上書きして復元します。\n'+info+'\nよろしいですか？'))return false;
  foods=d.foods;weights=d.weights;wishes=d.wishes;
  labels=(Array.isArray(d.labels)&&d.labels.length)?d.labels:DEFAULT_LABELS.slice();
  save('tamarun_foods',foods);save('tamarun_weights',weights);save('tamarun_wishes',wishes);save('tamarun_labels',labels);
  renderAll();alert('復元しました');return true;
}
document.getElementById('bExport').onclick=exportFile;
document.getElementById('bImportBtn').onclick=()=>document.getElementById('bFile').click();
document.getElementById('bFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>applyBackup(String(r.result));
  r.readAsText(f);e.target.value='';
};
document.getElementById('tShow').onclick=()=>{document.getElementById('tArea').value=buildBackup()};
document.getElementById('tCopy').onclick=async()=>{
  const ta=document.getElementById('tArea');
  if(!ta.value)ta.value=buildBackup();
  try{await navigator.clipboard.writeText(ta.value)}catch(e){ta.select();document.execCommand('copy')}
  markBackup();alert('コピーしました。メモアプリなどに貼り付けて保存してください');
};
document.getElementById('tRestore').onclick=()=>{
  const v=document.getElementById('tArea').value.trim();
  if(!v){alert('復元するテキストを貼り付けてください');return}
  applyBackup(v);
};

function renderAll(){renderLabels();renderFoods();renderWeights();renderWishes();renderSettings()}
renderAll();
</script>
</body>
</html>
